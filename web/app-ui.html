<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Intelligence · 全球热点情报</title>
<style>
:root{--bg:#0b0e14;--card:#11151d;--bd:#232a36;--fg:#dde4ee;--dim:#7d8899;--ac:#5ea3ff;--hot:#e8964a;--ok:#46b56a;--bad:#e05a5a;--tag:#1a2230}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
code{background:#0d1117;border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:12px;word-break:break-all}
header{padding:12px 20px 8px;border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:16px;font-weight:700;letter-spacing:.05em}
.sub{color:var(--dim);font-size:12px}
.topbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:200px;max-width:480px;background:var(--card);border:1px solid var(--bd);border-radius:6px;color:var(--fg);padding:8px 12px;font-size:14px}
button{background:var(--card);border:1px solid var(--bd);color:var(--fg);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
button.pri{background:#16263e;border-color:var(--ac);color:var(--ac)}
button.danger{border-color:var(--bad);color:var(--bad)}
nav{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
nav button{background:none;border:none;color:var(--dim);padding:6px 13px;border-radius:6px 6px 0 0;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--ac)}
main{max-width:1100px;margin:14px auto;padding:0 14px 64px}
h2{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.1em;margin:16px 0 8px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.meta{color:var(--dim);font-size:12px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{border:1px solid var(--bd);background:var(--tag);border-radius:4px;padding:0 7px;font-size:11px;color:var(--dim);white-space:nowrap}
.tag.ac{color:var(--ac)}.tag.hot{color:var(--hot)}.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.score{color:var(--hot);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.grid .card{margin:0}
.grid b{font-size:19px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--hot)}
.empty{color:var(--dim);text-align:center;padding:34px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.tw{overflow-x:auto}
select,input[type=text],input[type=password]{background:var(--card);border:1px solid var(--bd);color:var(--fg);border-radius:6px;padding:6px 9px;font-size:13px}
.excerpt{color:var(--dim);font-size:12.5px;margin-top:5px;max-height:80px;overflow:hidden}
#foot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);color:var(--dim);font-size:12px;padding:5px 18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:9}
.imf{width:100%;height:140px;object-fit:cover;border-radius:6px;margin-bottom:8px;background:#000}
.pager{display:flex;gap:8px;justify-content:center;padding:10px}
.radio{display:flex;gap:4px;flex-wrap:wrap}
.radio button{padding:4px 11px;border-radius:13px;font-size:12px;color:var(--dim)}
.radio button.on{color:var(--ac);border-color:var(--ac)}
pre.log{background:#0d1117;border:1px solid var(--bd);border-radius:6px;padding:10px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap;max-height:300px;overflow-y:auto;color:#9aa7b8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99}
.modal .box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;max-width:520px;width:92%}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1a2230;border:1px solid var(--bd);color:var(--fg);padding:8px 18px;border-radius:8px;z-index:100;font-size:13px}
@media (max-width:640px){header{padding:10px 12px}main{padding:0 10px 64px}#q{max-width:100%}nav button{padding:6px 9px}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Global Intelligence</h1><span class="sub">全球热点事件情报与 Agent 信息服务</span>
    <span style="flex:1"></span>
    <span class="sub" id="who"></span>
    <button id="btn-login" style="display:none" onclick="showLogin()">登录</button>
    <button id="btn-admin" style="display:none" onclick="goAdmin('admin')">管理后台</button>
    <button id="btn-logout" style="display:none" onclick="doLogout()">退出登录</button>
  </div>
  <div class="topbar">
    <input id="q" placeholder="搜索全球热点……" onkeydown="if(event.key==='Enter')runSearch()">
    <button onclick="runSearch()">搜索</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"><div class="empty">加载中……</div></main>
<div id="foot"><span>界面语言：简体中文 · 内容保持原文 · 数据全部来自真实系统</span><span id="clock"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{if(!t)return"—";const d=(Date.now()-new Date(t).getTime())/36e5;return isNaN(d)?"—":d<1?Math.round(d*60)+"分钟前":d<48?Math.round(d)+"小时前":Math.round(d/24)+"天前"};
let USER=null, CSRF='', view='overview', cur={};
const ADMIN_TABS=[["admin","概览"],["sys","系统状态"],["searchsvc","搜索服务"],["collector","情报采集"],["events","事件"],["sources","来源"],["media","媒体"],["mcp","MCP 服务"],["api","API"],["users","用户"],["storage","存储"],["logs","日志"],["diag","系统诊断"],["ai","AI 服务"],["settings","设置"]];
const PUB_TABS=[["overview","概览"],["search","搜索"],["events","事件"],["sources","来源"],["media","媒体"],["system","系统"]];
async function j(u,o){const r=await fetch(u,o);if(!o||o.nothrow||r.ok)return r.json();throw new Error("HTTP "+r.status)}
async function adminApi(u,opt){opt=opt||{};opt.headers=Object.assign({"X-GI-CSRF":CSRF,"Content-Type":"application/json"},opt.headers||{});
  const r=await fetch(u,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
async function saveFlags(){const b={};["public_rest","web_search_api","ui_gate"].forEach(k=>{const el=document.getElementById("flag-"+k);if(el)b[k]=el.checked});try{const saved=await adminApi("/api/admin/flags",{method:"POST",body:JSON.stringify(b)});["public_rest","web_search_api","ui_gate"].forEach(k=>{const el=document.getElementById("flag-"+k);if(el)el.checked=!!saved[k]});toast("已保存并生效: 公开API="+(saved.public_rest?"开":"关")+" 未登录搜索="+(saved.web_search_api?"开":"关")+" 登录门="+(saved.ui_gate?"开":"关"))}catch(e){toast("保存失败: "+(e.message||e))}}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function copy(text,label){navigator.clipboard.writeText(text).then(()=>toast((label||"内容")+"已复制")).catch(()=>toast("复制失败，请手动选择"))}
function agoClock(){$("#clock").textContent=new Date().toLocaleTimeString("zh-CN")}
setInterval(agoClock,1000);agoClock();
function dot(ok,warn){return `<span class="dot ${ok?"ok":warn?"warn":"bad"}"></span>`}
function pg(d,fn){if(d.total==null)return"";const step=d.limit||20,mx=Math.max(0,Math.floor((d.total-1)/step)*step);
  return `<div class="pager"><button onclick="${fn}(0)" ${cur.offset?"":"disabled"}>‹</button><span class="meta">${d.total} 条</span><button onclick="${fn}(${(cur.offset||0)+step})" ${(cur.offset||0)>=mx?"disabled":""}>›</button></div>`}

/* ============ 启动 ============ */
async function boot(){
  try{const me=await j("/api/auth/me");USER=me.user;CSRF=me.csrf||""}catch(e){USER=null}
  paintWho();renderTabs();
  const h=location.hash.replace("#","");
  if(h&&h.startsWith("admin")){if(USER&&USER.role==="admin"){goAdmin(h.split("/")[1]||"admin");return}showLogin();return}
  go(h||"overview");
}
function paintWho(){$("#who").textContent=USER?`已登录：${esc(USER.username)}（${USER.role==="admin"?"管理员":"用户"}）`:"未登录";
  $("#btn-login").style.display=USER?"none":"";$("#btn-admin").style.display=USER&&USER.role==="admin"?"":"none";$("#btn-logout").style.display=USER?"":"none"}
function renderTabs(){const tabs=USER&&USER.role==="admin"?PUB_TABS.concat([["admin","管理后台"]]):PUB_TABS;
  $("#tabs").innerHTML=tabs.map(([v,l])=>`<button data-v="${v}" class="${view===v?"on":""}">${l}</button>`).join("")}
document.addEventListener("click",e=>{if(e.target.matches("#tabs button"))go(e.target.dataset.v)});
window.addEventListener("hashchange",boot);
async function go(v){view=v;cur={};renderTabs();
  if(v==="admin"){if(!(USER&&USER.role==="admin")){showLogin();return}goAdmin("admin");return}
  $("#main").innerHTML='<div class="empty">加载中……</div>';
  try{await ({overview:pubOverview,search:searchPage,events:pageEvents,media:pageMedia,sources:pageSources,system:pageSystem}[v]||pubOverview)()}
  catch(e){$("#main").innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`}}
function showLogin(){const old=$(".modal");if(old)old.remove();
  const d=document.createElement("div");d.className="modal";
  d.innerHTML=`<div class="box"><h2 style="color:var(--fg);font-size:15px">管理员 / 用户登录</h2>
    <div style="margin:10px 0"><input type=text id=lu placeholder=用户名 style="width:100%"></div>
    <div style="margin:10px 0"><input type=password id=lp placeholder=密码 style="width:100%"></div>
    <div class="meta" id="lerr"></div>
    <div style="margin-top:12px;display:flex;gap:8px"><button class=pri onclick="doLogin()">登录</button><button onclick="this.closest('.modal').remove()">取消</button></div></div>`;
  document.body.appendChild(d);$("#lu").focus()}
async function doLogin(){
  try{const r=await j("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("#lu").value.trim(),password:$("#lp").value})});
    $(".modal").remove();USER=r.user;CSRF=r.csrf;paintWho();renderTabs();
    if(USER.role==="admin"){location.hash="admin";goAdmin("admin")}else go("overview")}
  catch(e){const el=$("#lerr");if(el)el.innerHTML=`<span style="color:var(--bad)">${esc(e.message||"登录失败")}</span>`}}
async function doLogout(){await j("/api/auth/logout",{method:"POST"});USER=null;CSRF="";location.hash="";boot()}

/* ============ 公开：概览 ============ */
async function pubOverview(){
  const [h,t]=await Promise.all([j("/api/status"),j("/api/trending?limit=6&hours=48")]);
  let x=`<h2>全球热点事件</h2>`;
  x+=t.results.length?t.results.map(r=>`<div class="card"><div class="row"><div style="flex:1;min-width:0"><a href="#" onclick="openEvent(${r.story_id});return false">${esc(r.title)}</a></div><span class="score">${(+r.score).toFixed(1)}</span></div><div class="meta"><span class="tag hot">${r.importance==="high"?"重要":"常规"}</span><span>${r.source_count} 个来源 · ${r.article_count} 篇文章</span><span>${esc(r.category||"—")}</span><span>${ago(r.last_updated)}</span></div></div>`).join(""):'<div class="empty">暂无数据</div>';
  const dk=h.disk||{};
  x+=`<h2>系统状态</h2><div class="grid">
    <div class="card"><div class="meta">文章</div><b>${h.articles_total}</b><div class="meta">24 小时新增 ${h.articles_24h}</div></div>
    <div class="card"><div class="meta">事件</div><b>${h.stories_active}</b><div class="meta">持续跟踪</div></div>
    <div class="card"><div class="meta">媒体</div><b>${h.images_total}</b><div class="meta">72 小时窗口</div></div>
    <div class="card"><div class="meta">来源</div><b>${h.sources_active}</b><div class="meta">持续采集</div></div></div>
    <div class="card"><div class="row"><b style="font-size:14px">存储</b><span class="tag ${dk.level==="normal"?"ok":"hot"}">${({normal:"正常",warning:"注意",high:"偏高",emergency:"紧急"})[dk.level]||"—"} · ${dk.data_pct_of_3gb}% / 3GB</span></div><div class="bar"><i style="width:${Math.min(100,+(dk.data_pct_of_3gb||0))}%"></i></div></div>`;
  const mcp=h.mcp||{};
  x+=`<h2>Agent 接入</h2><div class="card"><div class="row"><b style="font-size:14px">MCP 服务</b><span class="tag ${mcp.enabled?"ok":"bad"}">${mcp.enabled?"在线":"未配置"}</span></div>
    <div class="meta"><span>协议 Streamable HTTP</span><span>Bearer 认证</span><span>${(mcp.tools||[]).length} 个只读工具</span></div></div>
    <div class="card"><div class="row"><b style="font-size:14px">REST API</b><span class="tag ok">在线</span></div><div class="meta"><span><code>/api/news · /api/stories · /api/search · /api/media</code></span></div></div>`;
  $("#main").innerHTML=x}

/* ============ 搜索（网络/情报库/事件/媒体） ============ */
let SCOPE="all";
async function searchPage(){
  $("#main").innerHTML=`<div class="card"><div class="row"><b style="font-size:14px">搜索范围</b></div>
    <div class="radio" id="scoperow" style="margin-top:8px">${[["all","全部"],["web","互联网"],["intel","我的情报库"],["events","事件"],["media","媒体"]].map(([v,l])=>`<button data-s="${v}" class="${SCOPE===v?"on":""}">${l}</button>`).join("")}</div></div>
    <div id="sres"></div>`;
  $("#scoperow").addEventListener("click",e=>{if(e.target.dataset.s){SCOPE=e.target.dataset.s;
    $$("#scoperow button").forEach(b=>b.classList.toggle("on",b===e.target));if(cur.q)runSearch()}});
  if(cur.q)runSearch()}
async function runSearch(){
  const q=($("#q").value||cur.q||"").trim();if(!q){toast("请输入搜索关键词");return}
  cur.q=q;view="search";renderTabs();
  if(!$("#sres")){await searchPage()}
  $("#sres").innerHTML='<div class="empty">搜索中……</div>';
  try{
    if(SCOPE==="events"){const d=await j(`/api/stories/search?q=${encodeURIComponent(q)}&limit=20`);
      $("#sres").innerHTML=(d.results.map(s=>`<div class="card"><div class="row"><div style="flex:1"><a href="#" onclick="openEvent(${s.id});return false">${esc(s.title)}</a></div><span class="tag hot">事件</span></div><div class="meta"><span>${s.article_count} 篇 / ${s.source_count} 个来源</span><span>${ago(s.last_updated)}</span></div></div>`).join("")||'<div class="empty">未找到相关事件</div>');return}
    if(SCOPE==="media"){const d=await j(`/api/media?q=${encodeURIComponent(q)}&limit=12`);
      $("#sres").innerHTML=(d.results.map(a=>`<div class="card">${a.image_main_url?`<img class="imf" src="${esc(a.image_main_url)}" loading="lazy" onerror="this.remove()">`:""}<div class="row"><div style="flex:1"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></div><span class="tag ac">媒体 · ${esc(a.source_slug)}</span></div><div class="meta"><span>${esc(a.author||"—")}</span><span>${ago(a.published_at||a.discovered_at)}</span></div></div>`).join("")||'<div class="empty">未找到相关媒体</div>');return}
    const scope=SCOPE==="web"?"web":SCOPE==="intel"?"intelligence":"all";
    const d=await j(`/api/search?q=${encodeURIComponent(q)}&scope=${scope}&limit=10`);
    let x="";
    if(d.web){
      x+=`<h2>互联网</h2>`;
      x+=d.web.results.length?d.web.results.map(r=>`<div class="card"><div class="row"><div style="flex:1"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div><span class="tag">互联网 · ${esc(r.source)}</span></div><div class="meta"><span>${r.published?ago(r.published):"时间未知"}</span><span>来自 ${esc(r.provider)}</span></div>${r.snippet?`<div class="excerpt">${esc(r.snippet)}</div>`:""}</div>`).join(""):'<div class="empty">互联网搜索无结果（全部搜索后端均失败）</div>';
      x+=`<div class="meta">搜索后端：${(d.web.providers||[]).map(p=>`<span class="tag ${p.status==="ok"?"ok":"bad"}">${esc(p.provider)} ${p.status==="ok"?"正常":"失败"}</span>`).join(" ")} · ${d.web.elapsed_ms}ms</div><div style="height:8px"></div>`}
    if(d.intelligence){
      const st=(d.intelligence.stories||{results:[]}).results, ar=(d.intelligence.articles||{results:[],total:0});
      x+=`<h2>我的情报库</h2>`;
      x+=st.length?st.map(s=>`<div class="card"><div class="row"><div style="flex:1"><a href="#" onclick="openEvent(${s.id});return false">${esc(s.title)}</a></div><span class="tag hot">事件 · 已采集</span></div><div class="meta"><span>${s.article_count} 篇 / ${s.source_count} 个来源</span><span>${ago(s.last_updated)}</span></div></div>`).join(""):"";
      x+=ar.results.map(a=>`<div class="card"><div class="row"><div style="flex:1"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></div><span class="tag ac">情报库 · ${esc(a.source_name)}</span></div><div class="meta"><span>已采集 ${ago(a.published_at||a.discovered_at)}</span><span>${esc(a.language||"")}原文</span></div></div>`).join("");
      if(!st.length&&!ar.results.length)x+='<div class="empty">情报库暂无匹配（采集为持续累积）</div>'}
    $("#sres").innerHTML=x}
  catch(e){$("#sres").innerHTML=`<div class="empty">搜索失败：${esc(e.message)}</div>`}}

/* ============ 事件 ============ */
async function pageEvents(offset){cur.offset=offset||0;
  const d=await j(`/api/stories?limit=20&offset=${cur.offset}`);
  $("#main").innerHTML=(d.results.map(s=>`<div class="card"><div class="row"><div style="flex:1"><a href="#" onclick="openEvent(${s.id});return false">${esc(s.title)}</a></div>${s.heat?`<span class="score">${(+s.heat).toFixed(2)}</span>`:""}</div><div class="meta"><span class="tag hot">${s.importance==="high"?"重要":"常规"}</span><span>${s.article_count} 篇 / ${s.source_count} 个来源</span><span>${esc(s.category||"—")}</span><span>${ago(s.last_updated)}</span></div><div class="meta">${(s.articles||[]).slice(0,4).map(a=>`<span>· ${esc(a.source_name)}</span>`).join("")}</div></div>`).join("")||'<div class="empty">暂无数据</div>')+pg(d,"pageEvents")}
async function openEvent(id){
  $("#main").innerHTML='<div class="empty">加载中……</div>';
  const s=await j(`/api/stories/${id}`);
  const tl=(s.timeline||[]).map(t=>`<tr><td style="white-space:nowrap">${esc((t.at||"").slice(0,16))}</td><td>${esc(t.source)}</td><td><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a></td></tr>`).join("");
  $("#main").innerHTML=`<div class="card"><div class="meta"><span class="tag hot">事件 #${s.id}</span><span>${s.importance==="high"?"重要":"常规"}</span></div>
    <div style="font-size:18px;font-weight:700;margin:8px 0 2px">${esc(s.title)}</div>
    <div class="meta"><span>首次发现 ${(s.first_seen||"—").slice(0,10)}</span><span>最近更新 ${ago(s.last_updated)}</span><span>热度 ${(+s.heat||0).toFixed(2)}</span><span>${s.article_count} 篇文章 · ${s.source_count} 个来源 · ${s.video_count||0} 视频</span><span>${esc(s.category||"—")}</span></div></div>
    <h2>时间线</h2><div class="card tw"><table><tr><th>时间</th><th>来源</th><th>标题（原文）</th></tr>${tl}</table></div>
    <div class="pager"><button onclick="view='events';pageEvents(0)">← 返回事件列表</button></div>`}

/* ============ 媒体 / 来源 / 系统（公开） ============ */
async function pageMedia(offset){cur.offset=offset||0;
  const d=await j(`/api/media?limit=12&offset=${cur.offset}`);

    <tr><td>数据库</td><td>${(dk.db_bytes/1048576).toFixed(1)} MB（+WAL ${(dk.wal_bytes/1048576).toFixed(1)}MB）</td><td>—</td></tr>
    <tr><td>图片</td><td>${((dk.images_bytes||0)/1048576).toFixed(1)} MB</td><td>${dk.images_files}</td></tr>
    <tr><td>缓存</td><td>${((dk.cache_bytes||0)/1048576).toFixed(1)} MB</td><td>${dk.cache_files}</td></tr></table></div>
    <h2>保留策略</h2><div class="card"><div class="meta"><span>原始正文 72h</span><span>缓存 72h</span><span>图片 72h</span><span>文章元数据 30 天</span><span>事件 90 天+</span></div>
    <div class="meta">磁盘四级保护：normal（&lt;50%）→ warning（≥50%）→ high（≥70%）→ emergency（≥85%，激进清理）；含 inode 保护。</div></div>`}
async function admLogs(){
  const d=await adminApi("/api/admin/logs");
  $("#main").innerHTML=`<h2>审计日志（管理操作）</h2><div class="card tw"><table><tr><th>时间</th><th>操作者</th><th>动作</th><th>详情</th></tr>
    ${d.audit.map(a=>`<tr><td>${esc((a.at||"").slice(0,19))}</td><td>${esc(a.actor)}</td><td><code>${esc(a.action)}</code></td><td class="meta">${esc(a.detail)}</td></tr>`).join("")}</table></div>
    <h2>Web 日志（最近 40 行）</h2><pre class="log">${esc(d.web)}</pre>
    <h2>采集日志（最近 30 行）</h2><pre class="log">${esc(d.cron)}</pre>`}
async function admDiag(){
  const d=await adminApi("/api/admin/diagnostics");
  $("#main").innerHTML=`<div class="card"><div class="row"><b style="font-size:14px">系统健康报告</b><span class="tag ${d.ok?"ok":"hot"}">${d.passed}/${d.total} 项通过</span></div></div>
    <div class="card tw"><table><tr><th>检查项</th><th>结果</th></tr>
    ${d.checks.map(c=>`<tr><td>${dot(c.ok)}<b>${esc(c.name)}</b></td><td>${c.ok?"✓":"✗"} <span class="meta">${esc(c.detail)}</span></td></tr>`).join("")}</table></div>
    <div class="card"><button onclick="copy(window.__diagreport||'','诊断报告')">复制诊断报告</button></div>`;
  window.__diagreport=d.report}
async function admAi(){
  const c=await adminApi("/api/admin/ai/config");
  $("#main").innerHTML=`<div class="card"><div class="row"><b style="font-size:14px">FreeLLM AI 增强（Auto 模式）</b>
    <span class="tag ${c.enabled?"ok":"bad"}">${c.enabled?"已启用":"已禁用"}</span></div>
    <div class="meta">Key 只存服务器（env.local + 数据库），此处仅显示掩码，绝不进入 Git/前端源码/MCP/日志。</div>
    <div class="row" style="margin-top:8px"><input id="ai-url" style="flex:1;min-width:240px" placeholder="API URL，如 https://…/v1" value="${esc(c.url)}">
    <input id="ai-key" type="password" style="flex:1;min-width:180px" placeholder="API Key（留空 = 保留现有 ${esc(c.key_masked)}）">
    <input id="ai-model" style="width:130px" placeholder="model" value="${esc(c.model)}">
    <label style="white-space:nowrap"><input type="checkbox" id="ai-enabled" ${c.enabled?"checked":""}> 启用</label>
    <button onclick="saveAi()">保存</button><button onclick="testAi()">测试连接</button></div>
    <div id="ai-test" class="meta" style="margin-top:6px"></div></div>
    <div class="card tw"><table><tr><th>AI Queue</th><th>值</th></tr>
    <tr><td>Pending</td><td>${c.queue.pending}</td></tr><tr><td>Done</td><td>${c.queue.done}</td></tr>
    <tr><td>Deferred(退避)</td><td>${c.queue.deferred}</td></tr><tr><td>Failed</td><td>${c.queue.failed}</td></tr>
    <tr><td>Expired(过期淘汰)</td><td>${c.queue.expired}</td></tr>
    <tr><td>Cache 条目</td><td>${c.cache_entries}</td></tr><tr><td>AI 增强事件</td><td>${c.enhanced}</td></tr>
    <tr><td>最近一轮</td><td>${esc(c.last_run||"-")}（done ${c.last_done||0} / fail ${c.last_failed||0}）</td></tr></table></div>`}
async function saveAi(){
  const b={url:$("#ai-url").value.trim(),model:$("#ai-model").value.trim()||"auto",enabled:$("#ai-enabled").checked};
  const k=$("#ai-key").value.trim(); if(k)b.key=k;
  const r=await adminApi("/api/admin/ai/config",{method:"POST",body:JSON.stringify(b)});
  toast(r.ok?"AI 配置已保存":"保存失败"); admAi()}
async function testAi(){
  $("#ai-test").textContent="测试中…（FreeLLM Auto 调用约 10-30s）";
  try{const r=await adminApi("/api/admin/ai/test",{method:"POST",body:"{}"});
    $("#ai-test").innerHTML=r.ok?`<span class="tag ok">连接正常</span> 实际模型: ${esc(r.model)} / ${r.latency}s`:`<span class="tag bad">失败</span> ${esc(r.error||r.raw||"")}`}
  catch(e){$("#ai-test").innerHTML=`<span class="tag bad">失败</span> ${esc(String(e.message||e))}`}}
async function admSettings(){
  const s=await adminApi("/api/admin/settings");
  let fl={};try{fl=await adminApi("/api/admin/flags")}catch(e){}
  $("#main").innerHTML=`<div class="card"><div class="row"><b style="font-size:14px">功能开关</b><span class="tag ok">保存即时生效</span></div>
    <div class="meta">公开 REST API：/api/news 等无钥匙读取｜未登录 /api/search：实时搜索代理开放给外人（不建议开，易致引擎封 IP）｜登录门：未登录访问跳登录页。</div>
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0"><input type="checkbox" id="flag-public_rest" ${fl.public_rest?"checked":""}>公开 REST API</label>
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0"><input type="checkbox" id="flag-web_search_api" ${fl.web_search_api?"checked":""}>未登录可用 /api/search</label>
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0"><input type="checkbox" id="flag-ui_gate" ${fl.ui_gate?"checked":""}>Web 登录门</label>
    <button id="flags-save" onclick="saveFlags()" style="padding:8px 16px;background:#238636;border:0;border-radius:8px;color:#fff;cursor:pointer">保存开关</button></div>
    <div class="card"><div class="row"><b style="font-size:14px">系统设置</b><span class="tag hot">只读展示</span></div>
    <div class="meta">配置经服务器 env.local（权限 600）修改并重启后生效；本页不做网页改写（安全考虑：避免网页层直接写敏感配置文件）。</div></div>
    <div class="card tw"><table><tr><th>项目</th><th>值</th></tr>
    <tr><td>原始正文保留</td><td>${s.retention.raw_hours}h（正文 72h）</td></tr>
    <tr><td>图片保留</td><td>${s.retention.images_hours}h</td></tr>
    <tr><td>元数据保留</td><td>${s.retention.metadata_days} 天</td></tr><tr><td>事件保留</td><td>${s.retention.story_days} 天+</td></tr>
    <tr><td>并发批次</td><td>扫描 ${s.batches.scan} / 抓取 ${s.batches.fetch} / 图片 ${s.batches.image}</td></tr>
    <tr><td>磁盘分级</td><td>${esc(s.disk_levels)}</td></tr>
    <tr><td>MCP bootstrap token</td><td>${s.mcp_token_env?"已配置":"未配置"}</td></tr></table></div>
    <h2>AI 服务（全部可选，默认禁用）</h2><div class="card"><div class="meta">${esc(s.ai.principle)}</div></div>
    <div class="card tw"><table><tr><th>Provider</th><th>状态</th></tr>
    ${s.ai.providers.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="tag ${p.configured?"ok":"bad"}">${p.configured?"已配置":"禁用"}</span></td></tr>`).join("")}</table></div>
    <div class="card"><div class="meta">预留用途：摘要 / 分类 / 事件聚类辅助 / 翻译 / 搜索结果整理 —— 所有 AI Provider 关闭时核心系统完整可用。</div></div>`}
boot();
</script>
</body>
</html>
